# 공공 GitLab CI — 타입검사·린트·단위테스트·빌드
image: node:20-alpine

stages: [check, build]

variables:
  NEXT_TELEMETRY_DISABLED: "1"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files: [package-lock.json]
  paths: [.npm/]

before_script:
  - npm ci --no-audit --no-fund

check:
  stage: check
  script:
    - npm run typecheck
    - npm run lint
    - npm test

build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths: [.next/standalone, .next/static]
    expire_in: 1 week

# Python 실행판: 단위·통합 테스트 + TypeScript 엔진과의 결과 동등성
python:
  stage: check
  image: python:3.11-slim
  before_script: []
  cache: {}
  script:
    - cd python && python -m unittest discover -s tests -t . -v
