<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>법령 로딩 UI</title>
<style>
/* ───────────── 법령 로딩 UI (외부 이미지 없음 · 순수 CSS 3D 책장 넘김) ───────────── */
:root {
  --ll-navy: #1e3a8a;      /* 표지 */
  --ll-navy-2: #27479e;
  --ll-blue: #2563eb;      /* 강조 */
  --ll-paper: #f8fafc;     /* 종이 */
  --ll-paper-2: #e8edf5;
  --ll-line: #cbd5e1;      /* 본문 줄 */
  --ll-text: #0f172a;
  --ll-sub: #475569;
  --ll-card: #ffffff;
  --ll-scrim: rgba(15, 23, 42, .38);
}
@media (prefers-color-scheme: dark) {
  :root { --ll-paper: #e2e8f0; --ll-paper-2: #cbd5e1; --ll-text: #e2e8f0; --ll-sub: #94a3b8; --ll-card: #0f172a; --ll-scrim: rgba(2, 6, 23, .6); }
}

.law-loader { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: var(--ll-scrim); backdrop-filter: blur(3px); opacity: 0; transition: opacity .2s ease; }
.law-loader.is-visible { opacity: 1; }
.law-loader[hidden] { display: none; }
/* 화면 일부(검색 결과 영역 등)에 넣을 때 */
.law-loader.is-inline { position: relative; inset: auto; min-height: 260px; background: transparent; backdrop-filter: none; }

.law-loader__card { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 28px 36px 24px; border-radius: 18px; background: var(--ll-card); box-shadow: 0 20px 50px rgba(15, 23, 42, .18); border: 1px solid rgba(148, 163, 184, .25); min-width: 260px; }
.law-loader.is-inline .law-loader__card { box-shadow: none; }

/* 책: 왼쪽·오른쪽 펼친 면 + 가운데 책등을 축으로 넘어가는 낱장 */
.law-book { position: relative; width: 132px; height: 92px; perspective: 600px; }
.law-book__cover { position: absolute; inset: -6px -8px -8px; border-radius: 6px; background: linear-gradient(180deg, var(--ll-navy-2), var(--ll-navy)); box-shadow: 0 6px 14px rgba(30, 58, 138, .35); }
.law-book__cover::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 6px; transform: translateX(-50%); background: rgba(0, 0, 0, .18); }
.law-book__side, .law-book__page { position: absolute; top: 0; width: 50%; height: 100%; background: var(--ll-paper); }
.law-book__side--left { left: 0; border-radius: 3px 0 0 3px; box-shadow: inset -8px 0 10px -8px rgba(15, 23, 42, .25); }
.law-book__side--right { right: 0; border-radius: 0 3px 3px 0; box-shadow: inset 8px 0 10px -8px rgba(15, 23, 42, .25); }
/* 본문 줄(조문처럼 보이는 가는 선) */
.law-book__side::before, .law-book__page::before { content: ""; position: absolute; inset: 14px 12px 12px; background: repeating-linear-gradient(180deg, var(--ll-line) 0 2px, transparent 2px 9px); opacity: .9; }
.law-book__side--left::after { content: ""; position: absolute; left: 12px; top: 6px; width: 26px; height: 4px; border-radius: 2px; background: var(--ll-blue); opacity: .7; }

.law-book__page { right: 0; transform-origin: left center; transform-style: preserve-3d; border-radius: 0 3px 3px 0; background: linear-gradient(90deg, var(--ll-paper-2), var(--ll-paper) 30%); animation: law-flip 2.4s cubic-bezier(.45, .05, .35, 1) infinite; }
.law-book__page:nth-child(5) { animation-delay: .8s; }
.law-book__page:nth-child(6) { animation-delay: 1.6s; }
/* 넘어가는 동안 종이가 살짝 휘어 보이도록 그림자 */
.law-book__page::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(90deg, rgba(15, 23, 42, .18), transparent 40%); opacity: 0; animation: law-shade 2.4s ease-in-out infinite; animation-delay: inherit; }

/* 다 넘어간 낱장은 왼쪽에서 살며시 사라졌다가 오른쪽에서 다시 나타나 끊김 없이 반복 */
@keyframes law-flip {
  0% { transform: rotateY(0deg); opacity: 0; }
  8%, 14% { transform: rotateY(0deg); opacity: 1; }
  55% { transform: rotateY(-100deg) skewY(-2deg); opacity: 1; }
  86% { transform: rotateY(-180deg); opacity: 1; }
  100% { transform: rotateY(-180deg); opacity: 0; }
}
@keyframes law-shade { 0%, 12% { opacity: 0; } 50% { opacity: 1; } 88%, 100% { opacity: 0; } }

.law-loader__msg { margin: 0; font: 600 16px/1.5 "Pretendard GOV Variable", "Pretendard", system-ui, -apple-system, "Malgun Gothic", sans-serif; color: var(--ll-text); letter-spacing: -.01em; }
.law-loader__msg .dots::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: law-dots 1.4s steps(4, end) infinite; }
@keyframes law-dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75%, 100% { content: "..."; } }

.law-loader__timer { margin: -8px 0 0; font: 500 13px/1.4 system-ui, -apple-system, "Malgun Gothic", sans-serif; color: var(--ll-sub); font-variant-numeric: tabular-nums; }
.law-loader__timer b { display: inline-block; min-width: 2.2em; margin-left: .15em; text-align: right; font-weight: 700; color: var(--ll-blue); }

/* 움직임 줄이기 설정을 존중: 넘김 대신 은은한 깜빡임 */
@media (prefers-reduced-motion: reduce) {
  .law-book__page, .law-book__page::after, .law-loader__msg .dots::after { animation: none; }
  .law-book__page { display: none; }
  .law-book { animation: law-breathe 1.6s ease-in-out infinite; }
  @keyframes law-breathe { 50% { opacity: .6; } }
}
</style>
</head>
<body>

<!-- ───────────── 마크업: 페이지에 한 번 두면 LawLoader 가 씀(없으면 자동으로 만듦) ───────────── -->
<div id="law-loader" class="law-loader" role="status" aria-live="polite" aria-busy="true" hidden>
  <div class="law-loader__card">
    <div class="law-book" aria-hidden="true">
      <div class="law-book__cover"></div>
      <div class="law-book__side law-book__side--left"></div>
      <div class="law-book__side law-book__side--right"></div>
      <div class="law-book__page"></div>
      <div class="law-book__page"></div>
      <div class="law-book__page"></div>
    </div>
    <p class="law-loader__msg"><span class="law-loader__text">법령 정보를 불러오는 중입니다</span><span class="dots" aria-hidden="true"></span></p>
    <p class="law-loader__timer">경과 시간: <b class="law-loader__sec">0.0</b>초</p>
  </div>
</div>

<script>
/**
 * 법령 로딩 UI
 *   LawLoader.show()                         // 화면 전체 덮개로 표시
 *   LawLoader.show({ message: "판례를 불러오는 중입니다", target: el })  // 특정 영역 안에 표시
 *   const sec = LawLoader.hide();            // 숨기고 걸린 시간(초) 반환
 * 경과 시간은 performance.now() 기준으로 0.1초마다 갱신(타이머가 밀려도 실제 시간과 어긋나지 않음)
 */
const LawLoader = (() => {
  let el = null;
  let timer = null;
  let started = 0;
  let home = null; // inline 표시 전에 있던 자리(다시 overlay 로 돌려놓기 위해)

  const ensure = () => {
    el = el || document.getElementById("law-loader");
    if (!el) {
      el = document.createElement("div");
      el.id = "law-loader";
      el.className = "law-loader";
      el.setAttribute("role", "status");
      el.setAttribute("aria-live", "polite");
      el.hidden = true;
      el.innerHTML = '<div class="law-loader__card"><div class="law-book" aria-hidden="true"><div class="law-book__cover"></div><div class="law-book__side law-book__side--left"></div><div class="law-book__side law-book__side--right"></div><div class="law-book__page"></div><div class="law-book__page"></div><div class="law-book__page"></div></div><p class="law-loader__msg"><span class="law-loader__text"></span><span class="dots" aria-hidden="true"></span></p><p class="law-loader__timer">경과 시간: <b class="law-loader__sec">0.0</b>초</p></div>';
      document.body.appendChild(el);
    }
    if (!home) home = el.parentNode;
    return el;
  };

  const tick = () => {
    const sec = (performance.now() - started) / 1000;
    el.querySelector(".law-loader__sec").textContent = sec.toFixed(1);
  };

  function show({ message = "법령 정보를 불러오는 중입니다", target = null } = {}) {
    ensure();
    el.querySelector(".law-loader__text").textContent = message.replace(/\.+$/, "");
    if (target) { target.appendChild(el); el.classList.add("is-inline"); }
    else { home.appendChild(el); el.classList.remove("is-inline"); }
    clearInterval(timer);
    started = performance.now();
    tick();
    timer = setInterval(tick, 100);
    el.hidden = false;
    el.setAttribute("aria-busy", "true");
    requestAnimationFrame(() => el.classList.add("is-visible"));
  }

  function hide() {
    if (!el || el.hidden) return 0;
    clearInterval(timer);
    timer = null;
    const sec = Math.round((performance.now() - started) / 100) / 10;
    el.classList.remove("is-visible");
    el.setAttribute("aria-busy", "false");
    setTimeout(() => { if (!timer) el.hidden = true; }, 200); // 사라지는 효과 뒤에 숨김
    return sec;
  }

  return { show, hide };
})();

/* ───────────── 사용 예: 법령 조회 요청 동안 표시 ─────────────
async function searchLaw(q) {
  LawLoader.show();
  try {
    const res = await fetch(`/api/laws?q=${encodeURIComponent(q)}`);
    return await res.json();
  } finally {
    const sec = LawLoader.hide();
    console.log(`조회 ${sec}초`);
  }
}
*/
</script>

<!-- 아래는 미리보기용 데모(실제 서비스에 넣을 때는 빼도 됨) -->
<div style="font:14px system-ui,'Malgun Gothic',sans-serif;max-width:560px;margin:48px auto;padding:0 16px;color:#0f172a">
  <h1 style="font-size:20px;color:#1e3a8a">법령 로딩 UI 미리보기</h1>
  <p style="color:#475569">버튼을 누르면 3초 동안 표시됩니다(실제로는 fetch 앞뒤에서 show/hide).</p>
  <button id="demo-overlay" style="padding:8px 14px;border-radius:8px;border:0;background:#1e3a8a;color:#fff;font-weight:700;cursor:pointer">화면 전체로 표시</button>
  <button id="demo-inline" style="padding:8px 14px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;color:#1e3a8a;font-weight:700;cursor:pointer">아래 영역 안에 표시</button>
  <div id="demo-area" style="margin-top:16px;border:1px dashed #cbd5e1;border-radius:12px;min-height:280px"></div>
  <p id="demo-log" style="color:#475569;font-variant-numeric:tabular-nums"></p>
</div>
<script>
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const log = (t) => (document.getElementById("demo-log").textContent = t);
  document.getElementById("demo-overlay").onclick = async () => { LawLoader.show(); await wait(3000); log(`걸린 시간 ${LawLoader.hide()}초`); };
  document.getElementById("demo-inline").onclick = async () => { LawLoader.show({ message: "판례를 불러오는 중입니다", target: document.getElementById("demo-area") }); await wait(3000); log(`걸린 시간 ${LawLoader.hide()}초`); };
  if (location.hash === "#auto") LawLoader.show();
</script>
</body>
</html>
